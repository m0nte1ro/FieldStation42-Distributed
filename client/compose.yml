# A FieldStation42 client on a PC with Docker. In a folder with this file and a client.json
# (from client.example.json: set server_url; local_api_port if the server runs on this PC):
#   xhost +local:docker            (let the containers draw on your display)
#   docker compose up -d           (pulls the published image; in the repo, add --build to build it)
# The host must use the server's time zone (the containers take the host's).
x-client: &client
  image: ghcr.io/m0nte1ro/fs42-client:latest
  build:
    context: ..
    dockerfile: client/Dockerfile
  network_mode: host
  environment:
    - DISPLAY=${DISPLAY:-:0}
    - PULSE_SERVER=unix:/run/pulse/native
    # a size like 1280x720 plays in a window instead of fullscreen (fs42 start --windowed)
    - FS42_WINDOW=${FS42_WINDOW:-}
    # original, broadcast or crt (fs42 start --look); empty: client.json's look, else broadcast
    - FS42_LOOK=${FS42_LOOK:-}
    # the OSD's frames, which mpv draws over the video (same path in both containers)
    - FS42_OSD_FILE=/run/fs42-osd/osd.bgra
  volumes:
    - type: bind
      source: ./client.json
      target: /app/client.json
      read_only: true
      bind:
        create_host_path: false   # a missing client.json stops compose instead of becoming a directory
    - /etc/localtime:/etc/localtime:ro
    - /tmp/.X11-unix:/tmp/.X11-unix
    # the host's sound server; on WSL set PULSE_SOCKET=/mnt/wslg/PulseServer
    - ${PULSE_SOCKET:-${XDG_RUNTIME_DIR:-/run/user/1000}/pulse/native}:/run/pulse/native
    - client-confs:/app/confs
    - client-catalog:/app/catalog
    - client-runtime:/app/runtime
    - osd-frames:/run/fs42-osd
  restart: unless-stopped

services:
  client:
    <<: *client
    container_name: fs42-client
    # hardware video decoding
    devices:
      - /dev/dri:/dev/dri

  osd:
    <<: *client
    container_name: fs42-osd
    depends_on: [client]
    # channel number, logos and volume, drawn by mpv over the picture; starts after the first sync
    command: ["sh", "-c", "sleep 10 && exec python3 -m client.osd.main"]

volumes:
  client-confs:
  client-catalog:
  client-runtime:
  # in memory: the OSD rewrites its frames many times a second
  osd-frames:
    driver_opts: {type: tmpfs, device: tmpfs}
