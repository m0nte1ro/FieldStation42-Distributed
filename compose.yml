# The FieldStation42 server. Console and APIs on http://<host>:4242; clients are installed separately.
#   just this file (+ .env):  docker compose up -d            (pulls the published image)
#   in a clone of the repo:   docker compose up -d --build    (builds it from source)
services:
  server:
    image: ghcr.io/m0nte1ro/fs42-server:latest
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: fs42-server
    ports:
      - "${FS42_PORT:-4242}:4242"
    environment:
      - TZ=${TZ:-Europe/Lisbon}
    volumes:
      - ./confs:/app/confs
      - ./catalog:/app/catalog
      - ./runtime:/app/runtime
      # your library shows up at /media in the server: point station content_dir (or catalog symlinks) there
      - ${MEDIA_DIR:-./media}:/media:ro
    # Chromium (autobump rendering) needs more shared memory than Docker's 64 MB default
    shm_size: 1gb
    restart: unless-stopped
